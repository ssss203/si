<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>肆的通话</title>
</head>
<body>
  <div id="call">
    <div class="card">
      <div class="topbar">
        <div class="call-title">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">通话</span>
        </div>
        <div class="topbar-actions">
          <div class="size-switch" id="size-switch">
            <button class="size-btn" data-size="0" title="小窗口">小</button>
            <button class="size-btn active" data-size="1" title="中窗口">中</button>
            <button class="size-btn" data-size="2" title="大窗口">大</button>
          </div>
          <button class="icon-btn" id="revert-btn" title="撤回肆最近的改动（回滚到它动手之前的存档）">↩️</button>
          <button class="icon-btn" id="new-chat-btn" title="新建对话（清空上下文与会话记忆）">🔄</button>
          <button class="icon-btn" id="settings-toggle" title="设置">⚙️</button>
          <button class="icon-btn" id="close-btn" title="关闭">×</button>
        </div>
      </div>

      <!-- 发现新版本：默认藏起来，主进程查到新版本才显示这一行 -->
      <div class="update-banner" id="update-banner" hidden>
        <span class="update-text" id="update-text"></span>
        <button class="update-btn" id="update-download-btn">去下载</button>
      </div>

      <div class="config-panel" id="config-panel" hidden>

        <div class="provider-block" id="block-deepseek">
          <div class="config-row">
            <label for="ds-key">DeepSeek API Key</label>
            <input type="password" id="ds-key" placeholder="sk- 开头" autocomplete="off" spellcheck="false">
          </div>
          <div class="config-row">
            <label for="ds-model">模型</label>
            <select id="ds-model">
              <option value="deepseek-chat">deepseek-chat（快，日常）</option>
              <option value="deepseek-reasoner">deepseek-reasoner（推理）</option>
            </select>
          </div>
        </div>


        <div class="config-row config-inline">
          <div>
            <div class="setting-label">朗读回复（TTS）</div>
            <div class="setting-desc">agent 回复后自动读出来</div>
          </div>
          <div class="toggle active" id="toggle-tts"></div>
        </div>
        <div class="config-row config-inline">
          <div>
            <div class="setting-label">AI 弹幕（摸头/认亲等互动气泡）</div>
            <div class="setting-desc">用 DeepSeek 生成肆风格的互动反馈，需先填好 API Key</div>
          </div>
          <div class="toggle" id="toggle-aibubble"></div>
        </div>
        <div class="config-row config-inline">
          <div>
            <div class="setting-label">允许肆自己动</div>
            <div class="setting-desc">播放动画 / 主动说话 / 安排提醒（每小时最多 6 次）</div>
          </div>
          <div class="toggle active" id="toggle-proactive"></div>
        </div>
        <div class="config-row config-inline">
          <div>
            <div class="setting-label">让肆偶尔看看我在干嘛</div>
            <div class="setting-desc">每 20~45 分钟随机瞥一眼前台窗口。只告诉它一个粗分类（比如「coding」），不传窗口标题原文；标题只在内存里过一下就丢，不写日志、不写会话文件。默认关闭。</div>
          </div>
          <div class="toggle" id="toggle-companion"></div>
        </div>
        <div class="config-row config-inline">
          <div>
            <div class="setting-label">自动检查新版本</div>
            <div class="setting-desc">启动后问一次 GitHub 有没有新版本，最多每周查一次；只发一个匿名请求，不带任何本机信息。默认开启。</div>
          </div>
          <div class="toggle active" id="toggle-update-check"></div>
        </div>
        <div class="config-row config-actions">
          <button class="primary-btn" id="save-config">保存设置</button>
          <span class="save-hint" id="save-hint"></span>
        </div>
      </div>

      <div class="messages" id="messages">
        <div class="empty-hint">有话直说，别磨蹭</div>
      </div>

      <div class="inputbar">
        <input type="text" id="chat-input" placeholder="输入消息…" autocomplete="off" spellcheck="false" maxlength="2000">
        <button class="send-btn" id="send-btn">发送</button>
      </div>
    </div>
  </div>
</body>
</html>
